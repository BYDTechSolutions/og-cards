<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Field guide</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fbf7f0; color: #1b1b1f; }
    header { padding: 48px 64px 16px; font-size: 28px; font-weight: 700; }
    .hero { display: grid; grid-template-columns: 1fr 520px; gap: 48px; align-items: center; padding: 32px 64px; }
    .hero h1 { font-size: 56px; line-height: 1.05; margin: 0; }
    .hero-art { width: 520px; height: 520px; }
    @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
    .hero-art .sheet { animation: rise .8s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .hero-art .sheet { animation: none; } }
  </style>
</head>
<body>
  <header>Field guide</header>
  <section class="hero">
    <h1>Ship a static site in an afternoon</h1>
    <svg class="hero-art" viewBox="0 0 520 520" role="img" aria-label="Stacked pages beside a sun">
      <rect width="520" height="520" fill="#f1e9dc"/>
      <circle cx="390" cy="130" r="72" fill="#f59e0b"/>
      <g class="sheet">
        <rect x="88" y="150" width="280" height="300" rx="18" fill="#fdba74" stroke="#1b1b1f" stroke-width="4" transform="rotate(-8 228 300)"/>
        <rect x="120" y="140" width="280" height="300" rx="18" fill="#ffffff" stroke="#1b1b1f" stroke-width="4"/>
        <rect x="152" y="180" width="150" height="22" rx="11" fill="#c2410c"/>
        <rect x="152" y="226" width="216" height="14" rx="7" fill="#d6d3d1"/>
        <rect x="152" y="254" width="190" height="14" rx="7" fill="#d6d3d1"/>
        <rect x="152" y="282" width="204" height="14" rx="7" fill="#d6d3d1"/>
        <rect x="152" y="330" width="96" height="64" rx="12" fill="#0f766e"/>
        <rect x="262" y="330" width="106" height="64" rx="12" fill="#1b1b1f"/>
      </g>
    </svg>
  </section>
</body>
</html>
